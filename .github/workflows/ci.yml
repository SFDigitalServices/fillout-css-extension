name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle

      - uses: actions/upload-artifact@v7
        with:
          path: dist/chrome-fillout-css.zip
          name: chrome-fillout-css.zip
